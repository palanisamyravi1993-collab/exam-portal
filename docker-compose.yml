services:
  db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: examdb, POSTGRES_DB: exam }
    volumes: [pgdata:/var/lib/postgresql/data]
  web:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://postgres:examdb@db/exam
      SECRET_KEY: change-me-to-a-long-random-string
      PUBLIC_URL: http://localhost:8000
    depends_on: [db]
volumes: { pgdata: {} }
